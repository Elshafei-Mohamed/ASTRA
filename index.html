<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Planet Jumping</title>
    <style>
      @font-face {
        font-family: "SF Pro";
        font-style: normal;
        font-weight: 400;
        src: local("SF Pro"), local("SF Pro Text");
      }
      @font-face {
        font-family: "SF Pro";
        font-style: normal;
        font-weight: 700;
        src: local("SF Pro Bold"), local("SF Pro Display Bold");
      }
      @font-face {
        font-family: "SF Pro Thin";
        font-style: normal;
        font-weight: 100;
        src: local("SF Pro Thin"), local("SF Pro Display Thin");
      }
      @font-face {
        font-family: Aalto;
        font-style: normal;
        font-weight: 400;
        src: local("Aalto");
      }
      :root {
        font-family: "SF Pro", Arial, sans-serif;
        color: #fff;
        background: #090807;
        font-synthesis: none;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      body {
        background: #090807;
      }
      .experience {
        position: relative;
        width: 100%;
        height: 100%;
        min-height: 540px;
        overflow: hidden;
        background: #0a0908;
      }
      .backgrounds,
      .background,
      .shade,
      .transition-layer,
      .transition-layer video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .background {
        object-fit: cover;
        opacity: 0;
        transition: opacity 0.8s ease;
      }
      .background.is-visible {
        opacity: 1;
      }
      .shade {
        z-index: 1;
        background: linear-gradient(
          to bottom,
          transparent 52%,
          rgba(0, 0, 0, 0.88) 100%
        );
        pointer-events: none;
      }
      .chrome {
        position: absolute;
        z-index: 4;
        transition:
          opacity 0.45s ease,
          filter 0.45s ease;
      }
      .experience.is-transitioning .chrome {
        opacity: 0;
        filter: blur(8px);
        pointer-events: none;
      }
      .header {
        left: clamp(18px, 1.95vw, 28px);
        right: clamp(18px, 1.95vw, 28px);
        top: clamp(18px, 3.1vh, 28px);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .header-actions {
        margin-left: auto;
        display: flex;
        align-items: center;
      }
      .nav {
        display: flex;
        align-items: center;
        height: 42px;
        padding: 4px 5px;
        border: 1px solid rgba(255, 255, 255, 0.45);
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(12px);
        border-radius: 999px;
      }
      .nav a {
        color: #fff;
        text-decoration: none;
        padding: 8px 19px;
        border-radius: 999px;
        line-height: 1;
      }
      .nav a.active {
        background: #fff;
        color: #000;
      }
      .menu {
        height: 42px;
        padding: 0 20px;
        border: 0;
        border-radius: 999px;
        background: #fff;
        color: #000;
        cursor: pointer;
      }
      .planet-list {
        left: clamp(18px, 1.95vw, 28px);
        top: 50%;
        transform: translateY(-43%);
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-size: 16px;
      }
      .planet-item {
        display: flex;
        align-items: center;
        min-height: 20px;
      }
      .planet-item.active {
        font-size: 18px;
        font-weight: 700;
        gap: 8px;
      }
      .planet-item.active:before {
        content: "";
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #fff;
      }
      .portal-wrap {
        left: 50%;
        top: 50%;
        width: min(320px, 31vw);
        transform: translate(-50%, -54%);
        perspective: none;
      }
      .portal-heading {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        font-size: 16px;
        opacity: 0;
      }
      .portal-heading strong {
        font-size: 18px;
        margin-left: 8px;
      }
      .portal {
        position: relative;
        display: block;
        width: 100%;
        aspect-ratio: 320/350;
        padding: 0;
        overflow: visible;
        border: 0;
        border-radius: 90px;
        background: transparent;
        cursor: pointer;
        box-shadow: none;
        transform: none !important;
      }
      .portal video,
      .portal img {
        visibility: hidden;
        position: absolute;
        width: 1px;
        height: 1px;
        pointer-events: none;
      }
      .portal-canvas {
        position: fixed;
        inset: 0;
        z-index: 3;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      .planet-content {
        left: clamp(28px, 4vw, 58px);
        right: clamp(28px, 3vw, 44px);
        bottom: clamp(24px, 3vh, 30px);
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        gap: 40px;
      }
      .planet-content h1 {
        font-family: Aalto, "Arial Narrow", sans-serif;
        font-size: clamp(128px, 21.8vw, 314px);
        font-weight: 400;
        line-height: 0.72;
        margin: 0 0 -0.04em;
        letter-spacing: 0;
        transform: translateX(-32px);
        opacity: 0;
      }
      .planet-content dl {
        width: min(447px, 34vw);
        margin: 0;
        font-size: 16px;
      }
      .fact {
        display: grid;
        grid-template-columns: 138px 1fr;
        gap: 18px;
        padding: 8px 0;
        border-bottom: 1px solid rgba(255, 255, 255, 0.48);
        opacity: 0;
      }
      .fact:last-child {
        border-bottom: 0;
      }
      .fact dt {
        font-weight: 700;
      }
      .fact dd {
        margin: 0;
      }
      .transition-layer {
        display: none;
      }
      .scene-canvas {
        display: none;
      }
      .loading {
        position: absolute;
        z-index: 12;
        left: 50%;
        bottom: 30px;
        transform: translateX(-50%);
        opacity: 0;
        font-size: 12px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        transition: opacity 0.2s;
      }
      .experience.is-loading .loading {
        opacity: 0.8;
      }
      .experience.is-transitioning .header,
      .experience.is-transitioning .planet-list {
        opacity: 1;
        filter: none;
        pointer-events: auto;
      }
      .experience.is-transitioning .shade {
        opacity: 1;
      }
      .experience.is-committing .background {
        transition: none !important;
      }
      .preloader {
        position: absolute;
        inset: 0;
        z-index: 20;
        background: #000;
        overflow: hidden;
      }
      .preloader video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .preloader-shade {
        position: absolute;
        inset: auto 0 0;
        height: 35%;
        background: linear-gradient(to bottom, transparent, #000);
      }
      .preloader.is-background {
        z-index: 0;
      }
      .preloader.is-background .preloader-shade {
        opacity: 0;
      }
      .floating-logo {
        position: fixed;
        z-index: 22;
        left: 50%;
        top: 50%;
        width: 59px;
        height: 58px;
        transform: translate(-50%, -50%);
        will-change: left, top, width, height, transform;
        transition:
          left 2s cubic-bezier(0.16, 1, 0.3, 1),
          top 2s cubic-bezier(0.16, 1, 0.3, 1),
          width 2s cubic-bezier(0.16, 1, 0.3, 1),
          height 2s cubic-bezier(0.16, 1, 0.3, 1),
          transform 2s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .floating-logo.is-docked {
        left: clamp(18px, 1.95vw, 28px);
        top: clamp(18px, 3.1vh, 28px);
        width: 37px;
        height: 36px;
        transform: none;
      }
      .floating-logo.is-settled {
        z-index: 5;
      }
      .preloader-count {
        position: fixed;
        z-index: 22;
        left: 50%;
        bottom: clamp(22px, 3.1vh, 28px);
        display: flex;
        align-items: flex-end;
        gap: 4px;
        transform: translateX(-50%);
        font-family: "SF Pro", Arial, sans-serif;
        line-height: 1;
      }
      .preloader-count > span:first-child {
        font-family: "SF Pro Thin", "SF Pro", Arial, sans-serif;
        font-size: 64px;
        font-weight: 100;
      }
      .preloader-count .percent {
        font-size: 24px;
        padding-bottom: 4px;
      }
      .preloader-count.is-leaving {
        animation: preload-count-out 0.75s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      @keyframes preload-count-out {
        to {
          opacity: 0;
          filter: blur(7px);
          transform: translate(-50%, -34px);
        }
      }
      body:not(.preload-complete) .custom-cursor {
        opacity: 0 !important;
      }
      html,
      body,
      button,
      a,
      .portal {
        cursor: none !important;
      }
      .custom-cursor {
        display: block;
        position: fixed;
        left: 0;
        top: 0;
        z-index: 100;
        width: 1px;
        height: 1px;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.2s ease;
      }
      .custom-cursor.is-visible {
        opacity: 1;
      }
      .cursor-dot,
      .cursor-orbit {
        position: absolute;
        left: 0;
        top: 0;
        border-radius: 50%;
        transform: translate(-50%, -50%);
      }
      .cursor-dot {
        width: 12px;
        height: 12px;
        background: #fff;
      }
      .cursor-orbit {
        width: 36px;
        height: 36px;
        border: 1px solid #fff;
        background: rgba(255, 255, 255, 0.4);
        transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
      }
      .custom-cursor.is-enter .cursor-orbit {
        transform: translate(-50%, -50%) scale(1.16);
      }
      .cursor-label {
        position: absolute;
        top: 26px;
        left: 0;
        transform: translateX(-50%) translateY(-4px);
        font:
          16px/1.2 "SF Pro",
          Arial,
          sans-serif;
        white-space: nowrap;
        opacity: 0;
        transition:
          opacity 0.2s ease,
          transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
      }
      .custom-cursor.is-enter .cursor-label {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
      body:not(.intro-ready) .header,
      body:not(.intro-ready) .planet-list,
      body:not(.intro-ready) .planet-content h1,
      body:not(.intro-ready) .planet-content .fact {
        opacity: 0;
      }
      .intro-ready .header {
        animation: reveal-down 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.1s both;
      }
      .intro-ready .planet-list {
        animation: reveal-side 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.65s both;
      }
      .content-revealing h1 {
        animation: title-rise 1.05s cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      .content-revealing .fact {
        animation: fact-rise 0.72s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      .content-revealing .fact:nth-child(1) {
        animation-delay: 0.52s;
      }
      .content-revealing .fact:nth-child(2) {
        animation-delay: 0.68s;
      }
      .content-revealing .fact:nth-child(3) {
        animation-delay: 0.84s;
      }
      .content-revealing .fact:nth-child(4) {
        animation-delay: 1s;
      }
      .mask-revealing .portal-heading {
        animation: portal-caption 0.85s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      .planet-list.is-switching .planet-item {
        animation: menu-row 0.58s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      .planet-list.is-switching .planet-item:nth-child(1) {
        animation-delay: 0.02s;
      }
      .planet-list.is-switching .planet-item:nth-child(2) {
        animation-delay: 0.05s;
      }
      .planet-list.is-switching .planet-item:nth-child(3) {
        animation-delay: 0.08s;
      }
      .planet-list.is-switching .planet-item:nth-child(4) {
        animation-delay: 0.11s;
      }
      .planet-list.is-switching .planet-item:nth-child(5) {
        animation-delay: 0.14s;
      }
      .planet-list.is-switching .planet-item:nth-child(6) {
        animation-delay: 0.17s;
      }
      .planet-list.is-switching .planet-item:nth-child(7) {
        animation-delay: 0.2s;
      }
      .planet-list.is-switching .planet-item:nth-child(8) {
        animation-delay: 0.23s;
      }
      .planet-list.is-switching .planet-item.active:before {
        animation: active-dot 0.55s cubic-bezier(0.22, 1, 0.36, 1) 0.18s both;
      }
      @keyframes reveal-down {
        from {
          opacity: 0;
          filter: blur(8px);
          transform: translateY(-18px);
        }
        to {
          opacity: 1;
          filter: blur(0);
          transform: translateY(0);
        }
      }
      @keyframes reveal-side {
        from {
          opacity: 0;
          filter: blur(8px);
          transform: translate(-20px, -43%);
        }
        to {
          opacity: 1;
          filter: blur(0);
          transform: translate(0, -43%);
        }
      }
      @keyframes title-rise {
        from {
          opacity: 0;
          filter: blur(12px);
          transform: translate(-32px, 42px);
        }
        to {
          opacity: 1;
          filter: blur(0);
          transform: translate(-32px, 0);
        }
      }
      @keyframes fact-rise {
        from {
          opacity: 0;
          filter: blur(7px);
          transform: translateY(18px);
        }
        to {
          opacity: 1;
          filter: blur(0);
          transform: translateY(0);
        }
      }
      @keyframes portal-caption {
        from {
          opacity: 0;
          filter: blur(7px);
          transform: translateY(22px);
        }
        to {
          opacity: 1;
          filter: blur(0);
          transform: translateY(0);
        }
      }
      @keyframes menu-row {
        from {
          opacity: 0.35;
          transform: translateX(-8px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }
      @keyframes active-dot {
        from {
          opacity: 0;
          transform: scale(0);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
      @media (max-width: 900px) {
        .nav {
          display: none;
        }
        .portal-wrap {
          width: min(300px, 48vw);
        }
        .planet-content h1 {
          font-size: clamp(105px, 24vw, 190px);
        }
        .planet-content dl {
          width: 43vw;
        }
        .fact {
          grid-template-columns: 110px 1fr;
        }
        .planet-list {
          font-size: 14px;
        }
        .planet-item.active {
          font-size: 16px;
        }
      }
      @media (max-width: 640px) {
        .experience {
          min-height: 600px;
        }
        .planet-list {
          display: none;
        }
        .portal-wrap {
          top: 44%;
          width: min(260px, 66vw);
        }
        .planet-content {
          left: 18px;
          right: 18px;
          bottom: 18px;
          display: block;
        }
        .planet-content h1 {
          font-size: clamp(98px, 30vw, 160px);
          margin-bottom: 20px;
        }
        .planet-content dl {
          width: 100%;
          font-size: 13px;
        }
        .fact {
          grid-template-columns: 92px 1fr;
          padding: 5px 0;
        }
        .portal-heading {
          font-size: 14px;
        }
        .portal-heading strong {
          font-size: 16px;
        }
        .menu {
          height: 38px;
        }
        .portal {
          border-radius: 70px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition-duration: 0.01ms !important;
        }
        .portal {
          transform: none !important;
        }
      }
    </style>
  </head>

              [

              [
                "Atmosphere:",
                "Extremely dense, mostly carbon dioxide, with clouds of sulfuric acid.",
              ],
            ],
          },
        };
        const experience = document.querySelector(".experience"),
          list = document.querySelector(".planet-list"),
          title = document.querySelector("#planet-title"),
          facts = document.querySelector("#facts"),
          nextName = document.querySelector("#next-name"),
          nextNumber = document.querySelector("#next-number"),
          portal = document.querySelector("#portal"),
          portalVideo = document.querySelector("#portal-video"),
          portalImage = document.querySelector("#portal-image"),
          portalCanvas = document.querySelector("#portal-canvas"),
          sceneCanvas = document.querySelector("#scene-canvas"),
          preloader = document.querySelector("#preloader"),
          preloaderVideo = document.querySelector("#preloader-video"),
          count = document.querySelector("#preloader-count"),
          value = document.querySelector("#preloader-value"),
          logo = document.querySelector("#floating-logo"),
          transitionVideo = document.querySelector("#transition-video"),
          loading = document.querySelector(".loading"),
          cursor = document.querySelector(".custom-cursor");
        let current = "mars",
          busy = false,
          transitionActive = false,
          expansion = 0,
          maskScale = 1,
          canvasOpacity = 1,
          rotX = 0,
          rotY = 0,
          targetX = 0,
          targetY = 0,
          lastTime = performance.now(),
          rendered = false;
        const ctx = portalCanvas.getContext("2d"),
          sceneCtx = sceneCanvas.getContext("2d");
        function render() {
          const state = states[current];
          experience.dataset.planet = current;
          title.textContent = state.name.toUpperCase();
          nextName.textContent = state.next;
          nextNumber.textContent = state.number;
          portal.setAttribute("aria-label", "Travel to " + state.next);
          facts.innerHTML = state.facts
            .map(
              ([key, val]) =>
                `<div class="fact"><dt>${key}</dt><dd>${val}</dd></div>`,
            )
            .join("");
          list.innerHTML = planets
            .map(
              (name) =>
                `<span class="planet-item${name.toLowerCase() === current ? " active" : ""}">${name}</span>`,
            )
            .join("");
          if (rendered) {
            list.classList.remove("is-switching");
            void list.offsetWidth;
            list.classList.add("is-switching");
          }
          rendered = true;
          document
            .querySelectorAll(".background")
            .forEach((video) =>
              video.classList.toggle(
                "is-visible",
                video.id === state.background,
              ),
            );
          if (state.image) {
            portalImage.src = state.image;
            portalImage.style.display = "block";
            portalVideo.style.display = "none";
          } else {
            portalImage.style.display = "none";
            portalVideo.style.display = "block";
            if (portalVideo.src !== state.portal)
              portalVideo.src = state.portal;
          }
        }
        function resizeCanvas() {
          const d = Math.min(devicePixelRatio || 1, 2);
          [portalCanvas, sceneCanvas].forEach((canvas) => {
            canvas.width = innerWidth * d;
            canvas.height = innerHeight * d;
            canvas.style.width = innerWidth + "px";
            canvas.style.height = innerHeight + "px";
          });
          ctx.setTransform(d, 0, 0, d, 0, 0);
          sceneCtx.setTransform(d, 0, 0, d, 0, 0);
        }
        function drawCover(context, media) {
          const mw = media.videoWidth || media.naturalWidth,
            mh = media.videoHeight || media.naturalHeight;
          if (!mw || !mh) return;
          const scale = Math.max(innerWidth / mw, innerHeight / mh),
            w = mw * scale,
            h = mh * scale;
          context.drawImage(
            media,
            (innerWidth - w) / 2,
            (innerHeight - h) / 2,
            w,
            h,
          );
        }
        function roundedPoints(w, h, r) {
          const points = [];
          [
            [w / 2 - r, -h / 2 + r, -Math.PI / 2, 0],
            [w / 2 - r, h / 2 - r, 0, Math.PI / 2],
            [-w / 2 + r, h / 2 - r, Math.PI / 2, Math.PI],
            [-w / 2 + r, -h / 2 + r, Math.PI, Math.PI * 1.5],
          ].forEach(([x, y, start, end]) => {
            for (let i = 0; i <= 10; i++) {
              const a = start + ((end - start) * i) / 10;
              points.push([x + Math.cos(a) * r, y + Math.sin(a) * r]);
            }
          });
          return points;
        }
        function drawShade(context) {
          const gradient = context.createLinearGradient(
            0,
            innerHeight * 0.52,
            0,
            innerHeight,
          );
          gradient.addColorStop(0, "rgba(0,0,0,0)");
          gradient.addColorStop(1, "rgba(0,0,0,.88)");
          context.fillStyle = gradient;
          context.fillRect(
            0,
            innerHeight * 0.52,
            innerWidth,
            innerHeight * 0.48,
          );
        }
        function draw(now) {
          const dt = Math.min(40, now - lastTime);
          lastTime = now;
          rotX += (targetX - rotX) * Math.min(1, dt * 0.009);
          rotY += (targetY - rotY) * Math.min(1, dt * 0.009);
          ctx.clearRect(0, 0, innerWidth, innerHeight);
          if (sceneCanvas.dataset.frozen === "true") {
            ctx.drawImage(sceneCanvas, 0, 0, innerWidth, innerHeight);
            drawShade(ctx);
          }
          const rect = portal.getBoundingClientRect(),
            e = expansion,
            cx =
              rect.left +
              rect.width / 2 +
              (innerWidth / 2 - (rect.left + rect.width / 2)) * e,
            cy =
              rect.top +
              rect.height / 2 +
              (innerHeight / 2 - (rect.top + rect.height / 2)) * e,
            baseW = rect.width + (innerWidth - rect.width) * e,
            baseH = rect.height + (innerHeight - rect.height) * e,
            scale = e ? 1 : maskScale,
            w = baseW * scale,
            h = baseH * scale,
            r = 90 * (1 - e) * scale,
            ax = (rotX * (1 - e) * Math.PI) / 180,
            ay = (rotY * (1 - e) * Math.PI) / 180;
          if (w > 1 && h > 1) {
            ctx.save();
            ctx.beginPath();
            roundedPoints(w, h, Math.min(r, w / 2, h / 2)).forEach(
              ([x, y], i) => {
                const xx = x * Math.cos(ay),
                  yy = y * Math.cos(ax),
                  z = x * Math.sin(ay) - y * Math.sin(ax),
                  p = 850 / (850 + z),
                  sx = cx + xx * p,
                  sy = cy + yy * p;
                i ? ctx.lineTo(sx, sy) : ctx.moveTo(sx, sy);
              },
            );
            ctx.closePath();
            ctx.clip();
            ctx.globalAlpha = canvasOpacity;
            ctx.fillStyle = "#030303";
            ctx.fillRect(0, 0, innerWidth, innerHeight);
            const state = states[current],
              media = transitionActive
                ? transitionVideo
                : state.image
                  ? portalImage
                  : portalVideo;
            drawCover(ctx, media);
            if (transitionActive) drawShade(ctx);
            ctx.restore();
          }
          requestAnimationFrame(draw);
        }
        function ease(t) {
          return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
        }
        function animateValue(setter, duration) {
          return new Promise((resolve) => {
            const start = performance.now();
            function frame(now) {
              const progress = Math.min(1, (now - start) / duration);
              setter(ease(progress));
              if (progress < 1) requestAnimationFrame(frame);
              else resolve();
            }
            requestAnimationFrame(frame);
          });
        }
        function mediaReady(media) {
          return new Promise((resolve) => {
            if (media.readyState >= 3) return resolve();
            let done = false;
            const finish = () => {
              if (done) return;
              done = true;
              resolve();
            };
            media.addEventListener("canplaythrough", finish, { once: true });
            media.addEventListener("loadeddata", finish, { once: true });
            media.addEventListener("error", finish, { once: true });
            setTimeout(finish, 1600);
            media.load();
          });
        }
        function revealMask() {
          experience.classList.remove("mask-revealing");
          void experience.offsetWidth;
          experience.classList.add("mask-revealing");
          maskScale = 0;
          return animateValue((v) => (maskScale = v), 1050);
        }
        function revealPlanetContent() {
          experience.classList.remove("content-revealing");
          void experience.offsetWidth;
          experience.classList.add("content-revealing");
        }
        async function startExperience() {
          await mediaReady(states[current].image ? portalImage : portalVideo);
          await revealMask();
          document.body.classList.add("intro-ready");
          setTimeout(revealPlanetContent, 850);
        }
        async function travel() {
          if (busy || current === "venus") return;
          busy = true;
          targetX = targetY = 0;
          const next = current === "mars" ? "earth" : "venus";
          experience.classList.add("is-loading");
          transitionVideo.src = states[current].portal;
          await mediaReady(transitionVideo);
          experience.classList.remove(
            "is-loading",
            "content-revealing",
            "mask-revealing",
          );
          experience.classList.add("is-transitioning");
          transitionVideo.currentTime = 0;
          transitionVideo.playbackRate = 1.3;
          canvasOpacity = 1;
          transitionActive = true;
          try {
            await transitionVideo.play();
            await animateValue((v) => (expansion = v), 1100);
            await new Promise((resolve) => {
              if (transitionVideo.ended) return resolve();
              transitionVideo.addEventListener("ended", resolve, {
                once: true,
              });
              setTimeout(resolve, 5000);
            });
            sceneCtx.clearRect(0, 0, innerWidth, innerHeight);
            drawCover(sceneCtx, transitionVideo);
            sceneCanvas.dataset.frozen = "true";
            current = next;
            experience.classList.add("is-committing");
            render();
            await new Promise((resolve) =>
              requestAnimationFrame(() => requestAnimationFrame(resolve)),
            );
            transitionActive = false;
            expansion = 0;
            maskScale = 0;
            canvasOpacity = 1;
            experience.classList.remove("is-transitioning", "is-committing");
            const mask = revealMask();
            setTimeout(revealPlanetContent, 100);
            await mask;
            setTimeout(() => {
              transitionVideo.removeAttribute("src");
              transitionVideo.load();
              sceneCanvas.dataset.frozen = "false";
              busy = false;
            }, 450);
          } catch (error) {
            transitionActive = false;
            expansion = 0;
            maskScale = 1;
            canvasOpacity = 1;
            experience.classList.remove(
              "is-transitioning",
              "is-committing",
              "is-loading",
            );
            busy = false;
          }
        }
        function runPreloader() {
          let finished = false;
          function finish() {
            if (finished) return;
            finished = true;
            value.textContent = "100";
            count.classList.add("is-leaving");
            logo.classList.add("is-docked");
            preloader.classList.add("is-background");
            document.body.classList.add("preload-complete");
            startExperience();
            setTimeout(() => count.remove(), 750);
            setTimeout(() => logo.classList.add("is-settled"), 2000);
          }
          function tick() {
            if (preloaderVideo.duration)
              value.textContent = Math.round(
                (preloaderVideo.currentTime / preloaderVideo.duration) * 100,
              );
            if (!finished) requestAnimationFrame(tick);
          }
          preloaderVideo.addEventListener(
            "loadedmetadata",
            () => {
              preloaderVideo.playbackRate = Math.max(
                0.25,
                preloaderVideo.duration / 3,
              );
              preloaderVideo.play().catch(finish);
              tick();
            },
            { once: true },
          );
          preloaderVideo.addEventListener("ended", finish, { once: true });
          setTimeout(finish, 5000);
          preloaderVideo.load();
        }
        let pointerX = innerWidth / 2,
          pointerY = innerHeight / 2,
          orbitX = pointerX,
          orbitY = pointerY;
        document.addEventListener(
          "pointermove",
          (event) => {
            pointerX = event.clientX;
            pointerY = event.clientY;
            cursor.classList.add("is-visible");
            targetY = (event.clientX / innerWidth - 0.5) * 37.4;
            targetX = (event.clientY / innerHeight - 0.5) * -33;
          },
          { passive: true },
        );
        document.addEventListener("pointerleave", () => {
          cursor.classList.remove("is-visible");
          targetX = targetY = 0;
        });
        portal.addEventListener("pointerenter", () =>
          cursor.classList.add("is-enter"),
        );
        portal.addEventListener("pointerleave", () =>
          cursor.classList.remove("is-enter"),
        );
        portal.addEventListener("click", travel);
        function cursorLoop() {
          orbitX += (pointerX - orbitX) * 0.2;
          orbitY += (pointerY - orbitY) * 0.2;
          cursor.style.transform = `translate3d(${orbitX}px,${orbitY}px,0)`;
          requestAnimationFrame(cursorLoop);
        }
        [...document.querySelectorAll(".background")].forEach((video) => {
          video.pause();
          video.currentTime = 0;
        });
        addEventListener("resize", resizeCanvas);
        resizeCanvas();
        render();
        requestAnimationFrame(draw);
        requestAnimationFrame(cursorLoop);
        runPreloader();
      })();
    </script>
  </body>
</html>
